name: 报告 Bug
description: 说明无法启动、定位异常或路线播放等问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿上传浏览器登录数据、账号信息或真实位置轨迹。"
  - type: input
    id: version
    attributes:
      label: 工具版本
      placeholder: "例如 v1.1.0 或 main 源码"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: Windows、Edge、Node.js 版本；搜索问题另写 Python 版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…
2. 点击…
3. 出现…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果和错误提示
      description: 可添加截图；先遮住个人信息。start.cmd 可显示启动错误。
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: 提交前检查
      options:
        - label: 我已阅读新手教程并搜索过已有反馈。
          required: true
