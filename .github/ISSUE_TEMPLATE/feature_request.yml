name: 提出建议
description: 告诉我们希望改善什么体验
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景或遇到的问题
      description: 先描述你想完成什么，以及现在不方便在哪里。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或补充说明
