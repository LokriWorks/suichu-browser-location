name: Package release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v1.1.0
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version do not match' }
      - run: node --test route.test.cjs
      - name: Build source bundle
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Upload bundle and checksum
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" "dist/suichu-browser-location-$env:RELEASE_TAG.zip" "dist/SHA256SUMS.txt" --clobber
