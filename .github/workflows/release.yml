name: Package release
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v1.2.1
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $env:RELEASE_TAG) { $env:RELEASE_TAG = "v$version" }
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version do not match' }
          "RELEASE_TAG=$env:RELEASE_TAG" >> $env:GITHUB_ENV
          $build = 'true'
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $PSNativeCommandUseErrorActionPreference = $false
            gh release view "$env:RELEASE_TAG" --json tagName --jq .tagName *> $null
            if ($LASTEXITCODE -eq 0) { $build = 'false' }
            $global:LASTEXITCODE = 0
          }
          "build=$build" >> $env:GITHUB_OUTPUT
      - run: npm test
        if: steps.version.outputs.build == 'true'
      - name: Build Windows EXE
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify EXE with no Node or Python on PATH
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        env:
          SUICHU_HEADLESS: '1'
        run: ./scripts/smoke-windows.ps1
      - name: Build source bundle
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Upload bundle and checksum
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: |
          ./scripts/write-checksums.ps1
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view "$env:RELEASE_TAG" --json tagName --jq .tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "dist/Suichu-$env:RELEASE_TAG-win-x64.exe" "dist/suichu-browser-location-$env:RELEASE_TAG.zip" "dist/SHA256SUMS.txt" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" --target "$env:GITHUB_SHA" --title "随处 $env:RELEASE_TAG · 双击即用 EXE" --notes-file "docs/releases/$env:RELEASE_TAG.md" "dist/Suichu-$env:RELEASE_TAG-win-x64.exe" "dist/suichu-browser-location-$env:RELEASE_TAG.zip" "dist/SHA256SUMS.txt"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
